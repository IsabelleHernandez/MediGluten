<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Medicines</title>
<link href="https://fonts.googleapis.com/css2?family=Cousine:wght@400;700&family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
<style>
  
  @font-face {
    font-family: 'Norwester';
    src: local('Norwester'), url('fonts/norwester.woff2') format('woff2'), url('fonts/norwester.otf') format('opentype');
  }
  @font-face {
    font-family: 'Now';
    src: local('Now'), url('fonts/now-regular.woff2') format('woff2'), url('fonts/now-regular.otf') format('opentype');
    font-weight: 400;
  }

  :root {
    --page-bg: #c7e2ff;       /* light blue */
    --title-bar: #437fbf;     /* dark blue */
    --scroll-light: #99bbdf;  /* medium blue */
    --btn-gray: #6c8bab;      /* gray blue */
    --star: #ffe36e;          /* yellow */
    --border-dark: #2b5a91;   /* darker outline for borders */
    --panel-bg: #eef0f0;
    --text: #111;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page-bg);
    font-family: 'Now', 'Fredoka', sans-serif;
    color: var(--text);
    padding: 20px;
  }

  .window {
    max-width: 980px;
    margin: 0 auto;
  }

  /* Title bar */
  .title-bar {
    background: var(--title-bar);
    border: 4px solid var(--border-dark);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px 6px 10px;
  }
  .title-bar h1 {
    margin: 0;
    font-family: 'Cousine', monospace;
    font-weight: 700;
    font-size: 1.3rem;
    color: #d6d6d6;
    letter-spacing: 0.02em;
  }
  .win-buttons { display: flex; gap: 5px; }
  .win-buttons button {
    width: 30px; height: 28px;
    background: var(--btn-gray);
    border: 2px solid #1d2b3a;
    display: grid; place-items: center;
    padding: 0;
    cursor: pointer;
  }
  .win-buttons .min::before { content: ""; width: 14px; height: 3px; background: #111; margin-top: 10px; }
  .win-buttons .max::before { content: ""; width: 14px; height: 14px; border: 2px solid #111; }
  .win-buttons .close::before { content: "\2715"; font-size: 17px; line-height: 1; color: #111; }

  /* Nav */
  nav {
    display: flex;
    gap: 52px;
    padding: 14px 8px 8px;
    font-family: 'Cousine', monospace;
    font-size: 1.3rem;
    letter-spacing: 0.04em;
  }
  nav a { color: var(--text); text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  nav a[aria-current="page"] { font-weight: 700; }

  /* Content panel */
  .panel {
    background: var(--panel-bg);
    border: 2px solid var(--border-dark);
    border-bottom: 0;
    min-height: 380px;
    padding: 18px 44px 40px;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(325px, 100%);
    height: 54px;
    border: 2px solid #333;
    border-radius: 30px;
    padding: 0 18px;
    background: transparent;
  }
  .search svg { flex: none; }
  .search input {
    flex: 1;
    min-width: 0;
    height: 36px;
    border: 0;
    border-left: 2px solid #222;
    background: transparent;
    outline: none;
    padding-left: 8px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.1rem;
  }

  .lists {
    display: flex;
    flex-wrap: wrap;
    gap: 40px 80px;
    margin-top: 26px;
  }
  .list { width: 300px; }

  h2 {
    margin: 0;
    font-family: 'Norwester', 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .list hr {
    border: 0;
    border-top: 1px solid #555;
    margin: 12px 0 14px;
  }
  .list.saved hr { border-top-color: #888; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 1.15rem;
  }
  li .name { display: flex; align-items: center; gap: 12px; }
  li .status { font-size: 1.1rem; }
  .icon { width: 22px; height: 22px; flex: none; }

  /* Bottom scroll bar */
  .scrollbar {
    display: flex;
    height: 34px;
    border: 2px solid #1d2b3a;
    background: var(--scroll-light);
  }
  .scrollbar .arrow {
    width: 38px;
    background: var(--title-bar);
    display: grid; place-items: center;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .scrollbar .arrow.left { border-right: 2px solid #1d2b3a; }
  .scrollbar .arrow.right { border-left: 2px solid #1d2b3a; }
  .scrollbar .track { flex: 1; position: relative; }
  .scrollbar .thumb {
    position: absolute;
    left: 95px; top: 0; bottom: 0;
    width: 70px;
    background: var(--title-bar);
    border-left: 2px solid #1d2b3a;
    border-right: 2px solid #1d2b3a;
  }

  @media (max-width: 640px) {
    nav { gap: 22px; font-size: 1rem; }
    .panel { padding: 18px 20px 30px; }
    .list { width: 100%; }
  }
</style>
</head>
<body>
  <div class="window">

    <header class="title-bar">
      <h1>Search Page</h1>
      <div class="win-buttons">
        <button class="min" aria-label="Minimize"></button>
        <button class="max" aria-label="Maximize"></button>
        <button class="close" aria-label="Close"></button>
      </div>
    </header>

    <nav>
      <a href="#">Home</a>
      <a href="#">Search</a>
      <a href="#" aria-current="page">Saved Medicines</a>
    </nav>

    <main class="panel">
      <label class="search">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" aria-hidden="true">
          <circle cx="20" cy="14" r="9"/>
          <line x1="13.5" y1="20.5" x2="4" y2="30" stroke-width="5"/>
        </svg>
        <input type="text" aria-label="Search saved medications">
      </label>

      <div class="lists">
        <section class="list saved">
          <h2>Saved Medications</h2>
          <hr>
          <ul>
            <li>
              <span class="name">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" aria-hidden="true">
                  <rect x="2" y="2" width="20" height="20" rx="3" stroke-width="1.5"/>
                  <path d="M5 12l5 6L22 3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Medication
              </span>
              <span class="status">Safe</span>
            </li>
            <li>
              <span class="name">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" aria-hidden="true">
                  <rect x="2" y="2" width="20" height="20" rx="3" stroke-width="1.5"/>
                  <path d="M5 12l5 6L22 3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Other medication
              </span>
              <span class="status">Unsafe</span>
            </li>
          </ul>
        </section>

        <section class="list favorites">
          <h2>Favorite Medications</h2>
          <hr>
          <ul>
            <li>
              <span class="name">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z" fill="#ffe36e" stroke="#d9b32b" stroke-width="1" stroke-linejoin="round"/>
                </svg>
                Medication
              </span>
              <span class="status">Safe</span>
            </li>
            <li>
              <span class="name">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z" fill="#ffe36e" stroke="#d9b32b" stroke-width="1" stroke-linejoin="round"/>
                </svg>
                Other medication
              </span>
              <span class="status">Unsafe</span>
            </li>
          </ul>
        </section>
      </div>
    </main>

    <div class="scrollbar" aria-hidden="true">
      <button class="arrow left" tabindex="-1">
        <svg width="16" height="18" viewBox="0 0 16 18"><path d="M15 1v16L1 9z" fill="#2b5a91"/></svg>
      </button>
      <div class="track"><div class="thumb"></div></div>
      <button class="arrow right" tabindex="-1">
        <svg width="16" height="18" viewBox="0 0 16 18"><path d="M1 1v16l14-8z" fill="#2b5a91"/></svg>
      </button>
    </div>

  </div>
</body>
</html>
